# Публикация страницы-приглашения на GitHub Pages.
# Сайт — содержимое папки stranica/ (index.html, anketa.js, anketa.css) и ничего больше:
# всё остальное содержимое репозитория на Pages не попадает.
# Сборки нет намеренно — страница самодостаточна, без сборщиков и внешних библиотек.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одна публикация за раз; начатую не отменяем, чтобы не оставить сайт наполовину выложенным.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stranica
      - id: deployment
        uses: actions/deploy-pages@v4
